name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Runs on main and compile_v* are never cancelled: formcompiler
# releases a commit only when this workflow passed on that exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install dependencies
        run: ./formweb install
      - name: Audit frontend packages
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Build the Rust engine and frontend
        run: ./formweb build
      - name: Check Python syntax and skill mirrors
        run: |
          backend/venv/bin/python -m compileall -q backend/app setup
          ./formweb agents sync --check
      - name: Check shell syntax
        run: |
          for file in formweb formweb_oc_install backend/oc_install backend/boot_backend frontend/oc_install frontend/boot_frontend setup/lib.sh setup/install setup/install_core setup/install_backend setup/install_frontend setup/boot setup/boot_backend setup/boot_frontend setup/build setup/serve setup/doctor; do
            bash -n "$file"
          done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Rust tests and the engine binary
        working-directory: native
        run: |
          cargo test --release --locked
          cargo build --release --locked -p formweb-core
      - name: Engine and test dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Family layers and app tests
        working-directory: backend
        run: python -m pytest tests -q -p no:cacheprovider

  window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Apt mirror fallback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            grep -q mirrors.edge.kernel.org /etc/apt/apt-mirrors.txt || printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
            grep -q '//archive.ubuntu.com' /etc/apt/apt-mirrors.txt || printf 'http://archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf 'Acquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build the engine binary
        working-directory: native
        run: cargo build --release --locked -p formweb-core
      - name: Build the window
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Engine, pytest and Playwright
        run: |
          pip install -r backend/requirements.txt pytest==9.1.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Window smoke (F7)
        run: python -m pytest frontend/tests/window -q -p no:cacheprovider
