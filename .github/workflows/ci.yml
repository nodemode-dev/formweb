name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install dependencies
        run: ./formweb install
      - name: Build the Rust engine and frontend
        run: ./formweb build
      - name: Check Python syntax and skill mirrors
        run: |
          backend/venv/bin/python -m compileall -q backend/app setup
          ./formweb agents sync --check
      - name: Check shell syntax
        run: |
          for file in formweb formweb_oc_install backend/oc_install backend/boot_backend frontend/oc_install frontend/boot_frontend setup/lib.sh setup/install setup/install_core setup/install_backend setup/install_frontend setup/boot setup/boot_backend setup/boot_frontend setup/build setup/serve setup/doctor; do
            bash -n "$file"
          done
