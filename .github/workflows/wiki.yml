name: wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish reviewed wiki source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/formweb-wiki"
          cp .docs/wiki/*.md "$RUNNER_TEMP/formweb-wiki/"
          cd "$RUNNER_TEMP/formweb-wiki"
          git config user.name nodemode-ai
          git config user.email mackin@nodemode.ai
          git add '*.md'
          if ! git diff --cached --quiet; then
            git commit -m 'docs: sync reviewed FormWeb wiki source'
            git push
          fi
