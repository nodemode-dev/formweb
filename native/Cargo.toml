[workspace]
members = ["crates/formweb-model", "crates/formweb-engine", "crates/formweb-export", "crates/formweb-core"]
resolver = "2"

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
formweb-model = { path = "crates/formweb-model" }
formweb-engine = { path = "crates/formweb-engine" }
formweb-export = { path = "crates/formweb-export" }
