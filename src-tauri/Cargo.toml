[package]
name = "formweb"
version = "0.19.0"
description = "FormWeb desktop shell"
authors = ["nodemode-ai"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

# Its own workspace, like formvis and formlit: the desktop shell is optional and never slows the engine build.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! expands to code that uses serde_json (formvis found this in its 1.43.0 build).
serde_json = "1"
# The family GPU renderer: thumbnails, the overview minimap and release diffs, called from the page through invoke.
formweb-render = { path = "../native/crates/formweb-render" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "objc2-core-foundation", "NSColor"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false
